# Publishes one site to SmarterASP with Web Deploy, like "Publish" in Visual Studio.
#
# It never runs on its own: someone has to press "Run workflow" (Actions tab, or the GitHub app)
# and pick the site, so a push to main can't change what the client apps are using.
#
# Needs one repository secret, SMARTERASP_PASSWORD (Settings → Secrets and variables → Actions):
# the SmarterASP control panel password. The user name and site addresses are not secret.
name: Publish to SmarterASP

on:
  workflow_dispatch:
    inputs:
      site:
        description: Site to publish
        required: true
        type: choice
        options:
          - "site5 · Panel del operador (Innova.OperatorDashboard)"
          - "site4 · Computadora a bordo SJB-10662 (Innova.OnboardComputer.Host)"
          - "site3 · Mapa (Innova.Occupancy.Map)"
          - "site2 · Occupancy API (la usan las apps cliente)"
      confirm_api:
        description: "Only for site2: type PUBLICAR to confirm, since the client apps use it"
        required: false
        type: string

# One publish at a time, so two runs never write to the same site together.
concurrency:
  group: publish-smarterasp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    env:
      SERVER: https://win1143.site4now.net:8172/msdeploy.axd
      USER: lg0618pp-002
      # The analyzed demo clip is not in Git (data/demo is ignored); the dashboard and the on-board
      # computer take it from the published dashboard.
      DEMO_BASE: http://lg0618pp-002-site5.htempurl.com/demo
    steps:
      - name: Choose the project
        id: target
        shell: pwsh
        run: |
          $site = "${{ inputs.site }}"
          switch -Wildcard ($site) {
            'site5*' { $project = 'src/Innova.OperatorDashboard/Innova.OperatorDashboard.csproj'; $iis = 'lg0618pp-002-site5'; $demo = 'video' }
            'site4*' { $project = 'src/Innova.OnboardComputer.Host/Innova.OnboardComputer.Host.csproj'; $iis = 'lg0618pp-002-site4'; $demo = 'results' }
            'site3*' { $project = 'src/Innova.Occupancy.Map/Innova.Occupancy.Map.csproj'; $iis = 'lg0618pp-002-site3'; $demo = 'none' }
            'site2*' { $project = 'src/Innova.Occupancy.Api/Innova.Occupancy.Api.csproj'; $iis = 'lg0618pp-002-site2'; $demo = 'none' }
            default { throw "Unknown site: $site" }
          }
          if ($iis -eq 'lg0618pp-002-site2' -and "${{ inputs.confirm_api }}" -ne 'PUBLICAR') {
            throw 'The Occupancy API is used by the client apps. Type PUBLICAR in "confirm_api" to publish it.'
          }
          "project=$project" >> $env:GITHUB_OUTPUT
          "iis=$iis" >> $env:GITHUB_OUTPUT
          "demo=$demo" >> $env:GITHUB_OUTPUT
          # Only the API has an environment of its own ("Demo" turns on its /simulate pages).
          "environment=$(if ($iis -eq 'lg0618pp-002-site2') { 'Demo' } else { '' })" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Make sure Web Deploy is installed
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe')) {
            choco install webdeploy -y --no-progress
          }

      - name: Fetch the demo clip from the published dashboard
        if: steps.target.outputs.demo != 'none'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force data/demo/videos, data/demo/results | Out-Null
          Invoke-WebRequest "$env:DEMO_BASE/la_bus_highlights.mp4.result.json" -OutFile data/demo/results/la_bus_highlights.mp4.result.json
          if ("${{ steps.target.outputs.demo }}" -eq 'video') {
            Invoke-WebRequest "$env:DEMO_BASE/la_bus_highlights.mp4" -OutFile data/demo/videos/la_bus_highlights.mp4
          }

      - name: Publish
        shell: pwsh
        env:
          SMARTERASP_PASSWORD: ${{ secrets.SMARTERASP_PASSWORD }}
        run: |
          if (-not $env:SMARTERASP_PASSWORD) { throw 'Add the SMARTERASP_PASSWORD repository secret first.' }
          # The same kind of publish profile Visual Studio uses (without the password), so the
          # publish behaves exactly like "Publish" there. The password goes in on the command line.
          $iis = '${{ steps.target.outputs.iis }}'
          $project = '${{ steps.target.outputs.project }}'
          $environment = '${{ steps.target.outputs.environment }}'
          $environmentLine = if ($environment) { "<EnvironmentName>$environment</EnvironmentName>" } else { '' }
          $profiles = Join-Path (Split-Path $project) 'Properties/PublishProfiles'
          New-Item -ItemType Directory -Force $profiles | Out-Null
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <Project>
            <PropertyGroup>
              <WebPublishMethod>MSDeploy</WebPublishMethod>
              <LastUsedBuildConfiguration>Release</LastUsedBuildConfiguration>
              <TargetFramework>net10.0</TargetFramework>
              <SelfContained>false</SelfContained>
              $environmentLine
              <AspNetCoreHostingModel>OutOfProcess</AspNetCoreHostingModel>
              <MSDeployServiceURL>$($env:SERVER)?site=$iis</MSDeployServiceURL>
              <DeployIisAppPath>$iis</DeployIisAppPath>
              <MSDeployPublishMethod>WMSVC</MSDeployPublishMethod>
              <SkipExtraFilesOnServer>false</SkipExtraFilesOnServer>
              <EnableMSDeployBackup>false</EnableMSDeployBackup>
              <EnableMsDeployAppOffline>true</EnableMsDeployAppOffline>
              <UserName>$($env:USER)</UserName>
              <AllowUntrustedCertificate>true</AllowUntrustedCertificate>
            </PropertyGroup>
          </Project>
          "@ | Set-Content -Encoding utf8 (Join-Path $profiles 'GitHub-WebDeploy.pubxml')

          dotnet publish $project -c Release "-p:PublishProfile=GitHub-WebDeploy" "-p:Password=$env:SMARTERASP_PASSWORD" | Tee-Object -Variable output
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed ($LASTEXITCODE)" }
          # Fail loudly if the build succeeded but nothing was uploaded.
          if (-not ($output -match 'Publish Succeeded|Successfully executed command|Updating file|Adding file')) {
            throw 'dotnet publish finished but Web Deploy did not report an upload; check the log above.'
          }

